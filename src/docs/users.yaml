paths:

  /api/users:

    get:
      summary: Listar usuarios
      description: >
        Devuelve el listado de usuarios de forma paginada. Nunca devuelve la coleccion
        completa: si no se envian parametros se aplica un limite por defecto de 10
        documentos, con un maximo de 100 por pagina.
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/role"
        - $ref: "#/components/parameters/email"
      responses:
        "200":
          description: Usuarios obtenidos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      pagination:
                        $ref: "#/components/schemas/Pagination"
                      payload:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
              example:
                status: success
                message: Lista de usuarios obtenido
                payload:
                  - _id: "652f1c8e4b3a2d0012a4f9b1"
                    firstName: Juan
                    lastName: Lorenzo
                    email: juan@mail.com
                    role: customer
                  - _id: "652f1c8e4b3a2d0012a4f9b2"
                    firstName: Ana
                    lastName: Perez
                    email: ana@mail.com
                    role: store
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      summary: Crear usuario
      description: Endpoint para la creacion de un usuario nuevo
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
            example:
              firstName: Juan
              lastName: Lorenzo
              email: juan@mail.com
              password: "123456"
              role: customer
      responses:
        "201":
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      payload:
                        $ref: "#/components/schemas/User"
              example:
                status: success
                message: Usuario creado
                payload:
                  _id: "652f1c8e4b3a2d0012a4f9b1"
                  firstName: Juan
                  lastName: Lorenzo
                  email: juan@mail.com
                  role: customer
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/users/{uid}:

    get:
      summary: Obtener usuario por ID
      description: Endpoint que devuelve un usuario segun su ID
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/uid"
      responses:
        "200":
          description: Usuario obtenido
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      payload:
                        $ref: "#/components/schemas/User"
              example:
                status: success
                message: Usuario obtenido por id
                payload:
                  _id: "652f1c8e4b3a2d0012a4f9b1"
                  firstName: Juan
                  lastName: Lorenzo
                  email: juan@mail.com
                  role: customer
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    put:
      summary: Actualizar usuario
      description: Endpoint para modificar los datos de un usuario existente
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/uid"
      requestBody:
        required: true
        description: Solo se envian los campos a modificar
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
            example:
              firstName: Juan Carlos
              role: store
      responses:
        "200":
          description: Usuario modificado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      payload:
                        $ref: "#/components/schemas/User"
              example:
                status: success
                message: Usuario modificado
                payload:
                  _id: "652f1c8e4b3a2d0012a4f9b1"
                  firstName: Juan Carlos
                  lastName: Lorenzo
                  email: juan@mail.com
                  role: store
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      summary: Eliminar usuario
      description: Endpoint para eliminar un usuario existente
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/uid"
      responses:
        "200":
          description: Usuario eliminado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      payload:
                        $ref: "#/components/schemas/User"
              example:
                status: success
                message: Usuario eliminado
                payload:
                  _id: "652f1c8e4b3a2d0012a4f9b1"
                  firstName: Juan
                  lastName: Lorenzo
                  email: juan@mail.com
                  role: customer
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/users/{uid}/documents:

    post:
      summary: Subir un documento de un usuario
      description: >
        Sube un archivo y lo asocia al usuario indicado. El binario se guarda en
        uploads/documents con un nombre UUID y en la base queda unicamente la metadata.
        Formatos aceptados: PDF, JPEG, PNG y WEBP. Tamano maximo: 5MB.
        Si la subida falla despues de guardar el archivo, este se elimina del disco.
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/uid"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document, type]
              properties:
                document:
                  type: string
                  format: binary
                  description: Archivo a subir (PDF, JPEG, PNG o WEBP, hasta 5MB)
                type:
                  type: string
                  enum: [user_document, driver_license, delivery_proof]
                  description: Tipo de documento
                  example: user_document
      responses:
        "200":
          description: Documento subido y asociado al usuario
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      payload:
                        $ref: "#/components/schemas/User"
              example:
                status: success
                message: Documento subido correctamente
                payload:
                  _id: "652f1c8e4b3a2d0012a4f9b1"
                  firstName: Juan
                  lastName: Lorenzo
                  email: juan@mail.com
                  role: customer
                  documents:
                    - originalName: dni-frente.pdf
                      fileName: "9f1c2d3e-4b5a-6c7d-8e9f-0a1b2c3d4e5f.pdf"
                      path: uploads/documents/9f1c2d3e-4b5a-6c7d-8e9f-0a1b2c3d4e5f.pdf
                      mimeType: application/pdf
                      size: 245812
                      type: user_document
        "400":
          $ref: "#/components/responses/InvalidFile"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
